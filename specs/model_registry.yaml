    backends:
      pytorch_eager: pending
      torch_compile: pending
      llama_cpp: capability_probe
      vllm: pending
    notes:
      - Never compare thinking-enabled and thinking-disabled latency in one protocol.

  - model_id: ministral3-8b-instruct-2512-gguf
