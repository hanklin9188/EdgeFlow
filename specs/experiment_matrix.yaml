schema_version: "1.1"
strategy:
  stages: [screening, focused_sweep, confirmatory]
  screening:
    prompt_tokens: [128, 1024, 4096]
    output_tokens: [32, 128]
    concurrency: [1, 4]
    repetitions_engine: 12
  focused_sweep:
    prompt_tokens: [128, 512, 1024, 2048, 4096]
    output_tokens: [32, 128, 512]
    concurrency: [1, 2, 4, 8]
    repetitions_engine: 30
  confirmatory:
    holdout_prompts: true
    repetitions_engine: 30
    online_requests_min: 200
    bootstrap_resamples: 10000

# Engineering status describes executable support, not a measured conclusion.
# Validation status is derived at runtime from local experiment artifacts and run verdicts.
experiments:
  E00:
    name: hardware_software_fingerprint
    phase: measurement_integrity
    kind: foundation
    engineering_status: implemented
  E01:
    name: timer_calibration
    phase: measurement_integrity
    kind: foundation
    engineering_status: implemented
  E02:
    name: thermal_background_noise
    phase: measurement_integrity
    kind: foundation
    engineering_status: implemented
  E03:
    name: repetition_confidence_stability
    phase: measurement_integrity
    kind: foundation
    engineering_status: implemented

  E04:
    name: pytorch_eager_baseline
    phase: runtime_baselines
    kind: benchmark
    engineering_status: implemented
    web_runnable: true
    models: [ministral3-3b-instruct-2512, llama-3.2-3b-instruct]
    backends: [pytorch_eager]
    dtypes: [bf16]
  E05:
    name: torch_compile_modes
    phase: runtime_baselines
    kind: benchmark
    engineering_status: implemented
    web_runnable: true
    models: [ministral3-3b-instruct-2512, llama-3.2-3b-instruct]
    backends: [torch_compile]
    compile_modes: [default, reduce-overhead, max-autotune, max-autotune-no-cudagraphs]
    dynamic_shapes: [false, auto, true]
  E06:
    name: dynamic_shape_recompilation
    phase: runtime_baselines
    kind: intervention
    engineering_status: implemented
    sequence: [128, 128, 1024, 128, 2048, 1024, 4096]
  E07:
    name: llama_cpp_quantization
    phase: runtime_baselines
    kind: benchmark
    engineering_status: implemented
    web_runnable: true
    models: [ministral3-3b-instruct-2512, ministral3-8b-instruct-2512-gguf]
    backends: [llama_cpp]
    quantizations: [Q8_0, Q6_K, Q5_K_M, Q4_K_M]
  E08:
    name: vllm_scheduler
    phase: runtime_baselines
    kind: benchmark
    engineering_status: implemented
    web_runnable: true
    models: [ministral3-3b-instruct-2512, llama-3.2-3b-instruct]
    backends: [vllm]
    max_num_batched_tokens: [1024, 2048, 4096, 8192]
    max_num_seqs: [1, 4, 8, 16]
  E09:
    name: cross_runtime_fairness_audit
    phase: runtime_baselines
    kind: audit
    engineering_status: implemented

  E10:
