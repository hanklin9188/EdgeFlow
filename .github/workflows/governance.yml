name: Governance Contract

on:
  push:
    paths:
      - "AGENTS.md"
      - "CONTEXT.md"
      - "docs/agents/**"
      - "docs/adr/**"
      - "docs/17_ENGINEERING_AND_EXPERIMENT_GOVERNANCE.md"
      - "docs/18_EXECUTION_BACKLOG.md"
      - "docs/19_VALIDATION_PARITY_AND_RELEASE_GATES.md"
      - "docs/20_SKILL_OPERATING_MODEL.md"
      - "skills/edgeflow-*/**"
      - "specs/validation_requirements.yaml"
      - "scripts/audit_validation_parity.py"
      - "tests/test_governance_contract.py"
      - ".github/workflows/governance.yml"
  pull_request:
    paths:
      - "AGENTS.md"
      - "CONTEXT.md"
      - "docs/agents/**"
      - "docs/adr/**"
      - "docs/17_ENGINEERING_AND_EXPERIMENT_GOVERNANCE.md"
      - "docs/18_EXECUTION_BACKLOG.md"
      - "docs/19_VALIDATION_PARITY_AND_RELEASE_GATES.md"
      - "docs/20_SKILL_OPERATING_MODEL.md"
      - "skills/edgeflow-*/**"
      - "specs/validation_requirements.yaml"
      - "scripts/audit_validation_parity.py"
      - "tests/test_governance_contract.py"
      - ".github/workflows/governance.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.7"
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run python scripts/audit_validation_parity.py
      - run: uv run pytest -q tests/test_governance_contract.py
