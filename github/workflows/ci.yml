name: Validate EdgeFlow project assets

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip pyyaml jsonschema
      - name: Validate schemas, examples, links, and skills
        run: python scripts/validate_package.py

  static-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject common secret and model-weight files
        shell: bash
        run: |
          set -euo pipefail
          test ! -f .env
          test ! -f credentials.json
          test ! -f token.json
          if find . -type f \( -name '*.safetensors' -o -name '*.gguf' -o -name '*.pt' -o -name '*.pth' \) | grep -q .; then
            echo 'Model/checkpoint artifact found in repository.' >&2
            exit 1
          fi
