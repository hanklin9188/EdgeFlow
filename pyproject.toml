[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "edgeflow-llm"
version = "0.1.0"
description = "Evidence-backed, workload-conditioned autotuning for local LLM inference"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "Hank Lin" }]
keywords = ["llm", "inference", "autotuning", "cuda", "triton", "benchmarking"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "fastapi>=0.115,<1",
  "jsonschema>=4.23,<5",
  "numpy>=2.0,<3",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
gpu = ["torch>=2.6", "transformers>=4.48"]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1"]

[project.scripts]
edgeflow = "edgeflow.cli.app:app"

[project.urls]
Homepage = "https://github.com/hanklin9188/EdgeFlow"
Repository = "https://github.com/hanklin9188/EdgeFlow"
Issues = "https://github.com/hanklin9188/EdgeFlow/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/edgeflow"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "gpu: requires a CUDA-capable GPU",
  "slow: longer-running integration validation",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.coverage.run]
source = ["edgeflow"]
branch = true
