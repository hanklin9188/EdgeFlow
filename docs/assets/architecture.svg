<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="EdgeFlow system architecture: control plane, data plane and evidence plane on one machine">
  <defs>
    <style>
      .s{font-family:Inter,"Segoe UI",Helvetica,Arial,sans-serif}
      .m{font-family:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .t{fill:#f2f6f3;font-size:16px;font-weight:600}
      .d{fill:#8fa2a7;font-size:12.5px}
      .lbl{fill:#78d5c8;font-size:11.5px;letter-spacing:2.2px}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#78d5c8"/>
    </marker>
    <marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#aaa7ff"/>
    </marker>
  </defs>

  <rect width="1200" height="720" rx="20" fill="#152129"/>
  <rect x="26" y="26" width="1148" height="668" rx="18" fill="none" stroke="#38505b" stroke-dasharray="7 6"/>
  <text class="m lbl" x="48" y="56">ONE WORKSTATION · NOTHING LEAVES LOOPBACK</text>

  <!-- CONTROL PLANE -->
  <text class="m lbl" x="60" y="106">CONTROL PLANE</text>
  <g>
    <rect x="60" y="120" width="244" height="90" rx="14" fill="#1e2d36" stroke="#38505b"/>
    <text class="s t" x="80" y="152">Browser · 127.0.0.1:8787</text>
    <text class="s d" x="80" y="176">Local Control Console UI</text>
    <text class="m d" x="80" y="196" font-size="11.5">session token in page memory only</text>
  </g>
  <path d="M304 165 L 358 165" stroke="#78d5c8" stroke-width="2" marker-end="url(#a)"/>
  <g>
    <rect x="362" y="120" width="252" height="90" rx="14" fill="#1e2d36" stroke="#38505b"/>
    <text class="s t" x="382" y="152">FastAPI control surface</text>
    <text class="s d" x="382" y="176">Host / Origin / CSRF / 1 MiB cap</text>
    <text class="m d" x="382" y="196" font-size="11.5">loopback bind enforced</text>
  </g>
  <path d="M614 165 L 668 165" stroke="#78d5c8" stroke-width="2" marker-end="url(#a)"/>
  <g>
    <rect x="672" y="120" width="244" height="90" rx="14" fill="#1e2d36" stroke="#38505b"/>
    <text class="s t" x="692" y="152">Typed job worker</text>
    <text class="s d" x="692" y="176">one GPU job at a time</text>
    <text class="m d" x="692" y="196" font-size="11.5">no shell=True, no free-form path</text>
  </g>
  <g>
    <rect x="944" y="120" width="196" height="90" rx="14" fill="#1e2d36" stroke="#38505b"/>
    <text class="s t" x="964" y="152">Typer CLI</text>
    <text class="s d" x="964" y="176">same contracts</text>
    <text class="m d" x="964" y="196" font-size="11.5">edgeflow &lt;command&gt;</text>
  </g>
  <path d="M1042 210 L 1042 244 L 850 244 L 850 212" fill="none" stroke="#38505b" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- DATA PLANE -->
  <text class="m lbl" x="60" y="300">DATA PLANE</text>
  <path d="M794 210 L 794 288 L 620 288 L 620 312" fill="none" stroke="#78d5c8" stroke-width="2" marker-end="url(#a)"/>
  <g>
    <rect x="60" y="314" width="1080" height="106" rx="14" fill="#1b2932" stroke="#38505b"/>
    <text class="s d" x="82" y="342">Runtime adapters — capability-probed, pinned versions, capability-safe skip</text>
    <g transform="translate(82,358)">
      <g><rect width="212" height="44" rx="11" fill="#273943" stroke="#38505b"/><text class="s" x="106" y="21" fill="#f2f6f3" font-size="14.5" text-anchor="middle">PyTorch eager</text><text class="m" x="106" y="36" fill="#8fa2a7" font-size="11" text-anchor="middle">reference data plane</text></g>
      <g transform="translate(228,0)"><rect width="212" height="44" rx="11" fill="#273943" stroke="#38505b"/><text class="s" x="106" y="21" fill="#f2f6f3" font-size="14.5" text-anchor="middle">torch.compile</text><text class="m" x="106" y="36" fill="#8fa2a7" font-size="11" text-anchor="middle">cold vs steady split</text></g>
      <g transform="translate(456,0)"><rect width="212" height="44" rx="11" fill="#273943" stroke="#38505b"/><text class="s" x="106" y="21" fill="#f2f6f3" font-size="14.5" text-anchor="middle">llama.cpp</text><text class="m" x="106" y="36" fill="#8fa2a7" font-size="11" text-anchor="middle">loopback OpenAI API</text></g>
      <g transform="translate(684,0)"><rect width="212" height="44" rx="11" fill="#273943" stroke="#38505b"/><text class="s" x="106" y="21" fill="#f2f6f3" font-size="14.5" text-anchor="middle">vLLM</text><text class="m" x="106" y="36" fill="#8fa2a7" font-size="11" text-anchor="middle">loopback OpenAI API</text></g>
    </g>
  </g>
  <path d="M600 420 L 600 452" stroke="#78d5c8" stroke-width="2" marker-end="url(#a)"/>
  <g>
    <rect x="360" y="454" width="480" height="58" rx="14" fill="#1e2d36" stroke="#78d5c8" stroke-opacity="0.5"/>
    <text class="s t" x="600" y="480" text-anchor="middle">NVIDIA GeForce RTX 4080 SUPER</text>
    <text class="m d" x="600" y="500" text-anchor="middle" font-size="11.5">16 GiB · SM 8.9 · results are fingerprint-scoped</text>
  </g>

  <!-- EVIDENCE PLANE -->
  <path d="M420 512 L 420 546 L 213 546 L 213 574" fill="none" stroke="#aaa7ff" stroke-width="2" marker-end="url(#ai)"/>
  <text class="m lbl" x="60" y="566">EVIDENCE PLANE</text>
  <g>
    <rect x="60" y="580" width="306" height="96" rx="14" fill="#1e2d36" stroke="#38505b"/>
    <text class="s t" x="82" y="612">Per-request raw artifacts</text>
    <text class="m d" x="82" y="636" font-size="11.5">metrics.jsonl · run_manifest.json</text>
    <text class="m d" x="82" y="656" font-size="11.5">hardware_fingerprint · execution_plan</text>
  </g>
  <path d="M366 628 L 418 628" stroke="#aaa7ff" stroke-width="2" marker-end="url(#ai)"/>
  <g>
    <rect x="422" y="580" width="330" height="96" rx="14" fill="#1e2d36" stroke="#38505b"/>
    <text class="s t" x="444" y="612">G0–G8 validation engine</text>
    <text class="m d" x="444" y="636" font-size="11.5">summaries recomputed from raw rows</text>
    <text class="m d" x="444" y="656" font-size="11.5">verdict is the final authority</text>
  </g>
  <path d="M752 628 L 804 628" stroke="#aaa7ff" stroke-width="2" marker-end="url(#ai)"/>
  <g>
    <rect x="808" y="580" width="332" height="96" rx="14" fill="#23413e" stroke="#78d5c8" stroke-opacity="0.5"/>
    <text class="s" x="830" y="612" fill="#78d5c8" font-size="16" font-weight="600">SQLite index → scoped policy</text>
    <text class="m d" x="830" y="636" font-size="11.5">only measured PASS rows are eligible</text>
    <text class="m d" x="830" y="656" font-size="11.5">fingerprint drift marks it STALE</text>
  </g>
</svg>
